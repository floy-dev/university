<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">

<html>
<head>
	<title>Создание и удаление таймер</title>
	<script language="JavaScript">
		var interval = 10;
		var intime = 0;
		function trans() {
			if (intime == interval) {
				clearTimeout();
				document.write("Таймер выключен");
			}
			else {
				document.getElementById('outcounter').innerText = intime + " ";
				// или так
				// document.getElementById('outcounter').innerText = intime + " ";
				intime += 1;
				setTimeout('trans()', 1000);
			}
		}
	</script>
</head>

<body onload="trans()">
Таймер работает
<span id="outcounter"> </span>
секунд


</body>
</html>
