<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">

<html>
<head>
	<title>Методы и свойства объекта history</title>
</head>

<body>

	<center>
	<h1> Кнопки
	<br /> Назад и Вперед</h1>
	<a href="javascript:history.go(-1);"><img border="0" src="forward.gif" /></a>
	<a href="javascript:history.go(1);"><img border="0" src="back.gif" /></a>
	<br />
	<br />
	<input type="Button" value="Длина списка History" onclick="alert(history.length);">

	</center>

</body>
</html>
