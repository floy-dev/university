<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">

<html>
<head>
	<title>Пример обработчика событий мыши</title>
	<style>
		.link{cursor: pointer; color: blue;}
		.not_link{cursor: default; color: black;}
	</style>
	<script src="jquery-1.7.2.min.js"></script>

	<script src="jquery.tooltip.js" type="text/javascript"></script>
	<link rel="stylesheet" href="jquery.tooltip.css" />

	<script src="jquery.prettyPhoto.js" type="text/javascript"></script>
	<link rel="stylesheet" href="prettyPhoto.css" />

	<script src="jquery.horizontalNav.min.js" type="text/javascript"></script>

	<script>
		$(document).ready(
	  		function() {
	  		$('#tooltip1').tooltip();

	  		$("#links a").prettyPhoto({theme:'dark_rounded', showTitle: false});

	  		$('.full-width').horizontalNav();

            $("#btn").click(
             function(){
             	element = $("[name=element]").val();
             	color = $("[name=color]").val();
             	$("#"+element).css('background-color', "#"+color);
             }
            )

	  		}
	  	);



		/*function setBgColor(element, color)
		{
			document.getElementById(element).style.backgroundColor = '#'+color;
		}*/

		function setOnclick(invoker, value) {
			var handler = function() {
				changeImg(value);
			};
			invoker.onclick = handler;
		}

		function changeImg(num)
		{    //alert(num);
			document.getElementById('bigImg').src='img/'+num+'_big.jpg';
			for (i = 1; i <= 5; i++)
			{
				document.getElementById('sp'+i).className = "link";
				setOnclick(document.getElementById('sp'+i), i);
			}
			document.getElementById('sp'+num).className = "not_link";
			document.getElementById('sp'+num).onclick = function() {};
		}
	</script>
</head>

<body>
	<h1>Изменим цвет бэграунда для элемента</h1>
	<h2 id="h2">Элемент h2</h2>
	<div id="div">Элемент div</div>
	<p id="p">Элемент p</p>
	<form>
		<p id="tooltip1" title="Введите имя тега"> Введите элемент <input type="text" name="element" value=""/> </p>
		<p> Введите цвет <input type="text" name="color" value=""/> </p>
		<!--<p> <input type="button" value="Изменить" onclick="setBgColor(this.form.element.value, this.form.color.value);"/> </p>-->
		<p> <input id="btn" type="button" value="Изменить" /> </p>
	</form>
    <br /><br />
    <img src="img/1_big.jpg" id="bigImg" />
    <p>
    	<span id="sp1" class="not_link"> [1] </span>
    	<span id="sp2" class="link" onclick="changeImg(2);"> [2] </span>
    	<span id="sp3" class="link" onclick="changeImg(3);"> [3] </span>
    	<span id="sp4" class="link" onclick="changeImg(4);"> [4] </span>
    	<span id="sp5" class="link" onclick="changeImg(5);"> [5] </span>
    </p>


    <div id="links">
	    <a href="img/1_big.jpg" title="Banana">
	        <img src="img/1.jpg" alt="Banana">
	    </a>
	    <a href="img/2_big.jpg" title="Apple">
	        <img src="img/2.jpg" alt="Apple">
	    </a>
	    <a href="img/3_big.jpg" title="Orange">
	        <img src="img/3.jpg" alt="Orange">
	    </a>
	</div>


	<nav class="horizontal-nav full-width">
      <ul>
        <li><a href="#">Navigation Item</a></li>
        <li><a href="#">Work</a></li>
        <li><a href="#">Blog</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

</body>
</html>
