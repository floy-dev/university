<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">

<html>
<head>
	<title>Запуск обработчика с проверкой</title>
	<script>
		window.isLoad=false;
		function inform() {
			alert ("Документ загружен");
		}
	</script>
</head>

<body onload="window.isLoad=true;">
	<input type="button" name="rest" value="Сведения о загрузке" onclick="if(window.isLoad) inform();" />
</body>
</html>
