<html>
<head>
	<title>Форматирование текста</title>
</head>
<body>
	<font size="7">шрифт размером 7</font><br />
	<font face="Courier New">Шрифт Courier New</font><br />
	<font color="red">Текст красного цвета</font><br />
	<b>Полужирный шрифт тегом b</b><br />
	<strong>Полужирный шрифт тегом strong</strong><br />
	<i>Курсив тегом i</i><br />
	<em>Курсив тегом em</em><br />
	<u>Подчеркнутый текст</u><br />
	<strike>зачеркнутый текст</strike>
</body>
</html>
