<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
 <head>
  <meta http-equiv="Content-Type" content="text/html; charset=windows-1251">
  <title>Тег Table</title>
 </head>
 <body>

<table width="100%" cellspacing="5" cellpadding="1" border="1">
	<caption>Заголовок таблицы</caption>
	<thead>
		<tr>
        	<th>Ячейка-заголовок 1</th>
        	<th colspan="2">Ячейка-заголовок 2</th>
		</tr>
	</thead>
	<tbody>
		<tr>
			<td>ячейка 1</td>
			<td>ячейка 2</td>
			<td>ячейка 3</td>
		</tr>
		<tr>
			<td bgcolor="yellow">ячейка 4</td>
			<td colspan="2" align="center">ячейка 5</td>
		</tr>
		<tr valign="bottom">
			<td height="50px">ячейка 6</td>
			<td height="50px" rowspan="2" align="center">ячейка 7</td>
			<td>ячейка 8</td>
		</tr>
		<tr>
			<td>ячейка 9</td>
			<td>ячейка 10</td>
		</tr>
	</tbody>
</table>

 </body>
</html>
